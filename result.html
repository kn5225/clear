<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLEAR</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; }
    main { padding: 12px 16px; }
    #body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
    #original { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; padding: 8px 9px; background: #e9f1ee; border-radius: 8px; font-size: 12px; }
    .actions { display: flex; gap: 6px; margin: 10px 0; }
    .actions button { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; color: #2f5d62; background: #fff; border: 1px solid #c3d2cb; border-radius: 999px; padding: 4px 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="" width="28" height="28" />
    <div><h1 id="title">CLEAR</h1><p class="sub">CLEAR could not show its card inside that page, so the result is here.</p></div>
  </header>
  <main>
    <p id="body" aria-live="polite">Working on it…</p>
    <p class="help" id="note" hidden></p>
    <div class="actions"><button type="button" id="switch"></button><button type="button" id="copy">Copy</button></div>
    <h2>Selected text</h2>
    <p id="original"></p>
  </main>
  <script src="result.js"></script>
</body>
</html>
